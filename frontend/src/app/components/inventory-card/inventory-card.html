<div class="inventory-card">

  <span class="card-image">
    <img src="{{product().image}}" alt="Product image" />
  </span>

  <div class="card-info">

    <span class="name">
      {{product().name}}
    </span>

    <span class="price">{{product().currentPrice}}g</span>

    <span class="quantity">
      Quantity: {{product().quantity}}
    </span>

    <span class="description">
      {{product().description}}
    </span>

  </div>

</div>
