<section>

  <div class="panel-container">

    <div class="store-header">MY STORE</div>

    <div class="options">

      <div class="selectors">

        <div class="selector-header">
          <h1>SELECT OPTION</h1>
        </div>

        <div class="add-product" (click)="showOption('ADD')">
          <div class="tile">
            ADD PRODUCT
          </div>
        </div>

        <div class="update-product" (click)="showOption('STOCK')">
          <div class="tile">
            PRODUCTS STOCK
          </div>
        </div>

        <div class="show-product" (click)="showOption('SHOW')">
          <div class="tile">
            SHOW PRODUCTS
          </div>
        </div>

      </div>

      <div class="selected-option">
        <ng-template #optionContainer></ng-template>
      </div>

    </div>

  </div>

</section>
